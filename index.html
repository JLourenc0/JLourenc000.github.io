<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FitDiário</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FitDiário">
<meta name="theme-color" content="#0D7A64">
</head><body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  /* Conceito: app de bolso para o ginásio e para o prato. Números condensados (como o quadro de cargas), cartões planos, barra de separadores em baixo. */
  --bg:#F0F1ED; --surface:#FFFFFF; --surface2:#E6E9E2; --fg:#17211D; --muted:#5A6862; --line:#D7DBD3;
  --accent:#0D7A64; --accent-fg:#FFFFFF; --accent-soft:#D3ECE4;
  --p:#2E6BDA; --c:#C98210; --f:#C4435B; --bad:#B3261E;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1311; --surface:#161D1A; --surface2:#202A26; --fg:#E7EEEA; --muted:#93A29B; --line:#27322D;
    --accent:#3FCFA8; --accent-fg:#06231B; --accent-soft:#17362D;
    --p:#6EA2FF; --c:#F0B24A; --f:#F27C92; --bad:#FF8A80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1311; --surface:#161D1A; --surface2:#202A26; --fg:#E7EEEA; --muted:#93A29B; --line:#27322D;
  --accent:#3FCFA8; --accent-fg:#06231B; --accent-soft:#17362D;
  --p:#6EA2FF; --c:#F0B24A; --f:#F27C92; --bad:#FF8A80; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--bg); color:var(--fg); font-family:var(--body); font-size:15px; line-height:1.45;
  padding-block:12px 92px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
#app{max-width:640px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:600;letter-spacing:.01em;text-wrap:balance}
h2{font-size:26px}
h3{font-size:19px;text-transform:uppercase;letter-spacing:.06em}
small,.muted{color:var(--muted)}
.num{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.note{font-size:13px;color:var(--muted);margin:6px 0}
.banner{background:var(--accent-soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.banner.warn{border-color:var(--bad)}

/* Datas e semana */
.datebar{display:flex;align-items:center;gap:6px;margin:4px 0 10px}
.datebar .lbl{flex:1;text-align:center;min-width:0}
.datebar .lbl b{display:block;font-family:var(--display);font-size:26px;font-weight:600;line-height:1.1}
.datebar .lbl b::first-letter{text-transform:uppercase}
.datebar .lbl small{font-size:12px}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:20px;line-height:1}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 7px;border-radius:10px;border:1px solid var(--line);background:var(--surface);min-width:0}
.day span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.day b{font-family:var(--display);font-size:20px;font-weight:600;line-height:1}
.day.today b{color:var(--accent)}
.day.on{background:var(--accent);border-color:var(--accent)}
.day.on span,.day.on b{color:var(--accent-fg)}
.day .bar{display:block;width:60%;height:22px;background:var(--surface2);border-radius:3px;position:relative;overflow:hidden}
.day.on .bar{background:rgba(255,255,255,.25)}
.day .bar u{position:absolute;left:0;right:0;bottom:0;background:var(--accent);display:block}
.day.on .bar u{background:var(--accent-fg)}
.day .dot{width:8px;height:8px;border-radius:50%;background:var(--surface2);display:block;margin:7px 0 7px}
.day .dot.on{background:var(--accent)}
.day.on .dot{background:rgba(255,255,255,.35)}
.day.on .dot.on{background:var(--accent-fg)}

/* Resumo do dia */
.sum{display:grid;gap:12px}
.big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big .num{font-size:52px;line-height:1}
.big .num.over{color:var(--bad)}
.meter{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.meter u{display:block;height:100%;background:var(--accent);border-radius:5px}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.macro b{font-family:var(--display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.macro small{display:block;font-size:12px}
.macro .meter{height:6px;margin-top:4px}
.macro.p .meter u{background:var(--p)} .macro.c .meter u{background:var(--c)} .macro.f .meter u{background:var(--f)}
.macro.p b{color:var(--p)} .macro.c b{color:var(--c)} .macro.f b{color:var(--f)}

/* Refeições */
.meal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.meal>header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meal>header .num{font-size:20px;color:var(--muted)}
.item{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.item>button.main{text-align:left;min-width:0}
.item b{display:block;font-weight:500;overflow-wrap:anywhere}
.item small{display:block;font-size:12px}
.item .num{font-size:20px}
.x{width:32px;height:32px;border-radius:8px;color:var(--muted);font-size:20px;line-height:1;display:grid;place-items:center}
.x:hover{background:var(--surface2)}
.add{margin-top:8px;width:100%;padding:10px;border-radius:10px;border:1px dashed var(--line);color:var(--accent);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.btn.primary,.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--bad)}
.btn.full{width:100%}
.btn.sm{padding:6px 10px;font-size:13px}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:500;color:var(--muted);font-size:12px}
td.num{font-size:17px}
tfoot td{font-weight:600}

/* Formulários */
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=search],select,textarea{
  width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);min-height:42px;font-size:16px}
textarea{min-height:90px;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:360px){.grid3{grid-template-columns:1fr 1fr}}

/* Treino */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.ex>header{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.exname{text-align:left;min-width:0}
.exname b{display:block;font-family:var(--display);font-size:22px;font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.exname small{font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.prev{font-size:13px;color:var(--muted);margin:4px 0 8px}
.prev .up{color:var(--accent);font-weight:600}.prev .down{color:var(--bad);font-weight:600}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr 44px 32px;gap:8px;align-items:center;margin-bottom:6px}
.setrow.hd{font-size:12px;color:var(--muted);margin-bottom:2px}
.setrow .sn{font-family:var(--display);font-size:18px;color:var(--muted);text-align:center}
.setrow input{text-align:center;padding:8px 6px;font-family:var(--display);font-size:20px;font-weight:600;min-height:40px}
.tag{font-size:11px;font-weight:600;letter-spacing:.06em;padding:3px 6px;border-radius:6px;background:var(--accent);color:var(--accent-fg);text-align:center;visibility:hidden}
.setrow.top .tag{visibility:visible}
.exfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.exfoot .sumline{font-size:13px;color:var(--muted)}
.exfoot .sumline b{color:var(--fg);font-family:var(--display);font-size:18px}
.spark{display:block;width:96px;height:30px;color:var(--accent)}
.prog{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.prog:first-of-type{border-top:0}
.prog b{display:block;font-weight:500;overflow-wrap:anywhere}

/* Folhas (modais) */
.sheet{position:fixed;inset:0;z-index:50}
.sheet-bg{position:absolute;inset:0;background:rgba(8,12,10,.55)}
.sheet-body{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--bg);border-radius:16px 16px 0 0;
  max-width:640px;margin:0 auto;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface2);padding:4px;border-radius:10px;margin-bottom:10px}
.seg button{padding:8px 4px;border-radius:8px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.res{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line)}
.res b{display:block;font-weight:500;overflow-wrap:anywhere}
.res small{display:block;font-size:12px}
.res .num{font-size:20px}
.pick{margin-top:12px;border:1px solid var(--accent);border-radius:12px;padding:14px;background:var(--surface)}
.pre{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0;text-align:center}
.pre div{background:var(--surface2);border-radius:8px;padding:6px 2px}
.pre b{display:block;font-family:var(--display);font-size:20px;font-weight:600;line-height:1.1}
.pre small{font-size:11px}
.scanbox video{width:100%;max-height:260px;border-radius:12px;background:#000;object-fit:cover;margin-bottom:8px}
.anim{position:relative;aspect-ratio:3/2;max-width:100%;border-radius:12px;overflow:hidden;background:var(--surface2);margin:8px 0}
.anim img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.anim img+img{animation:flip 1.8s ease-in-out infinite alternate}
@keyframes flip{0%,35%{opacity:0}65%,100%{opacity:1}}
@media (prefers-reduced-motion: reduce){
  .anim{aspect-ratio:auto;display:grid;grid-template-columns:1fr 1fr;gap:4px;background:none}
  .anim img,.anim img+img{position:static;animation:none;opacity:1;aspect-ratio:3/2}
}
ol.steps{padding-left:20px;margin:8px 0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.hrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:8px 0;border-top:1px solid var(--line);align-items:baseline}
.hrow:first-of-type{border-top:0}

/* Separadores */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(3,1fr);gap:4px;
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;font-size:12px;font-weight:500;color:var(--muted)}
#tabs button.on{color:var(--accent)}
#tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--fg);color:var(--bg);
  padding:10px 14px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 4px 16px rgba(0,0,0,.25)}
.toast button{margin-left:10px;font-weight:600;text-decoration:underline;color:inherit}
.empty{text-align:center;color:var(--muted);padding:22px 10px}
.empty b{display:block;color:var(--fg);font-family:var(--display);font-size:22px;font-weight:600}
</style>

<div id="app">
  <div id="banner" class="banner warn" hidden></div>
  <main id="view"></main>
</div>

<nav id="tabs" aria-label="Secções">

  <button data-tab="treino"><svg viewBox="0 0 24 24"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg>Treino</button>

</nav>

  <div class="sheet-bg" data-act="closeSheet"></div>

</div>

(function(){

var norm=function(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')};

/* ---------- Dados guardados ---------- */
var KEY='fitdiario.v1', storageOK=true;
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){storageOK=false}return null}
var S=Object.assign({profile:null,food:{},recents:[],workouts:{},weights:[]},load()||{});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));if(!storageOK){storageOK=true;updateBanner()}}catch(e){if(storageOK){storageOK=false;updateBanner()}}}
var snap=null;
function checkpoint(){snap=JSON.stringify(S)}
function undo(){if(!snap)return;var o=JSON.parse(snap);Object.keys(S).forEach(function(k){delete S[k]});Object.assign(S,o);snap=null;save();render();$('#toast').hidden=true}

/* ---------- Datas ---------- */
var DN=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
var pad=function(n){return String(n).padStart(2,'0')};

var RAW='Pão de trigo|270|9|55|1.5\nPão integral|250|10|45|3\nBroa de milho|230|5|48|1.5\nArroz cozido|130|2.7|28|0.3\nMassa cozida|158|5.8|31|0.9\nBatata cozida|87|1.9|20|0.1\nBatata-doce cozida|90|2|21|0.1\nAveia em flocos|375|13|60|7\nFlocos de milho|375|7|84|1\nCuscuz cozido|112|3.8|23|0.2\nQuinoa cozida|120|4.4|21|1.9\nPeito de frango grelhado|165|31|0|3.6\nFiambre de peru|105|17|2|3\nOvo cozido|155|13|1.1|11\nClara de ovo|52|11|0.7|0.2\nVaca magra grelhada|200|28|0|9\nBife de peru grelhado|150|30|0|3\nLombo de porco grelhado|200|28|0|9\nSalmão grelhado|208|22|0|13\nAtum ao natural (conserva)|116|26|0|1\nAtum em azeite (conserva)|190|27|0|8\nBacalhau cozido|105|23|0|1\nSardinha grelhada|210|25|0|12\nPescada cozida|90|20|0|1\nDourada grelhada|135|23|0|4.5\nCamarão cozido|100|21|0|1.5\nTofu|76|8|2|4.8\nFeijão cozido|95|6.5|16|0.5\nGrão-de-bico cozido|150|8.5|22|2.6\nLentilhas cozidas|115|9|20|0.4\nLeite meio-gordo|47|3.3|4.8|1.6\nLeite magro|34|3.4|5|0.1\nIogurte natural|60|3.5|4.7|3.2\nIogurte grego natural|97|9|4|5\nSkyr natural|63|11|4|0.2\nQueijo fresco magro|70|12|3|1\nQueijo flamengo|350|26|0.5|27\nRequeijão|120|10|4|7\nQueijo cottage|98|11|3.4|4.3\nBanana|89|1.1|23|0.3\nMaçã|52|0.3|14|0.2\nLaranja|47|0.9|12|0.1\nPera|57|0.4|15|0.1\nMorangos|32|0.7|7.7|0.3\nKiwi|61|1.1|15|0.5\nUvas|69|0.7|18|0.2\nMelancia|30|0.6|7.6|0.2\nAnanás|50|0.5|13|0.1\nAbacate|160|2|9|15\nMirtilos|57|0.7|14|0.3\nPêssego|39|0.9|10|0.3\nBrócolos cozidos|35|2.4|7|0.4\nCenoura crua|41|0.9|10|0.2\nTomate|18|0.9|3.9|0.2\nAlface|15|1.4|2.9|0.2\nEspinafres cozidos|23|3|3.6|0.3\nCouve cozida|30|2|5|0.4\nCourgette|17|1.2|3.1|0.3\nPepino|15|0.7|3.6|0.1\nCebola|40|1.1|9|0.1\nPimento|31|1|6|0.3\nFeijão-verde cozido|35|1.9|7|0.3\nSopa de legumes|35|1.2|5|1.2\nAzeite|884|0|0|100\nManteiga|717|0.9|0.1|81\nAmêndoas|579|21|22|50\nNozes|654|15|14|65\nAmendoim|567|26|16|49\nManteiga de amendoim|600|25|20|50\nCaju|553|18|30|44\nAzeitonas|145|1|4|15\nMel|304|0.3|82|0\nChocolate negro 70%|600|8|46|43\nProteína whey em pó|400|80|8|6\nBolacha Maria|440|7|75|12\nPastel de nata|300|6|38|14\nSumo de laranja|45|0.7|10|0.2\nCoca-Cola|42|0|10.6|0\nCerveja|43|0.5|3.6|0\nVinho tinto|85|0.1|2.6|0';

function mapOFF(p){var n=p.nutriments||{};var k=n['energy-kcal_100g'];if(k==null&&n['energy_100g']!=null)k=n['energy_100g']/4.184;var name=p.product_name_pt||p.product_name||'';if(!name||k==null||isNaN(k))return null;

var MEALS=[['pa','Pequeno-almoço'],['lm','Lanche da manhã'],['al','Almoço'],['la','Lanche'],['ja','Jantar'],['ce','Ceia']];
var ent=function(e){var m=e.g/100;return {k:e.k*m,p:e.p*m,c:e.c*m,f:e.f*m}};
function dayTot(date){var t={k:0,p:0,c:0,f:0},d=S.food[date];if(d)Object.keys(d).forEach(function(m){d[m].forEach(function(e){var x=ent(e);t.k+=x.k;t.p+=x.p;t.c+=x.c;t.f+=x.f})});return t}
function dayCount(date){var d=S.food[date],n=0;if(d)Object.keys(d).forEach(function(m){n+=d[m].length});return n}
function calcTargets(p){
  if(!p)return null;var w=+p.peso,h=+p.altura,a=+p.idade;if(!(w>0&&h>0&&a>0))return null;
  var bmr=10*w+6.25*h-5*a+(p.sexo==='f'?-161:5);var k=bmr*(+p.atividade||1.375);
  k+=({perder:-400,manter:0,ganhar:300})[p.objetivo||'manter'];k=Math.round(k/10)*10;
  if(+p.kcal>0)k=Math.round(+p.kcal);
  var prot=(p.objetivo==='perder'?2:1.8)*w,fat=0.25*k/9,carb=Math.max(0,(k-prot*4-fat*9)/4);
  return {k:k,p:Math.round(prot),c:Math.round(carb),f:Math.round(fat),bmr:Math.round(bmr)};
}
function targets(){return calcTargets(S.profile)||{k:2000,p:120,c:230,f:55,est:true}}

function topSet(sets){var b=null;(sets||[]).forEach(function(s){if(s.kg===''||s.reps===''||s.kg==null||s.reps==null)return;var kg=+s.kg,reps=+s.reps;if(!(kg>=0)||!(reps>0))return;if(!b||kg>b.kg||(kg===b.kg&&reps>b.reps))b={kg:kg,reps:reps,id:s.id}});return b}
var exKey=function(e){return e.dbId||norm(e.en||e.name)};
function history(key){var out=[];Object.keys(S.workouts).sort().forEach(function(d){((S.workouts[d]||{}).exercises||[]).forEach(function(e){if(exKey(e)!==key)return;var t=topSet(e.sets);if(t)out.push({d:d,kg:t.kg,reps:t.reps})})});return out}
var e1rm=function(kg,reps){return kg*(1+reps/30)};
function spark(pts){
  if(pts.length<2)return '';var w=120,h=36,mn=Math.min.apply(null,pts),mx=Math.max.apply(null,pts),rg=(mx-mn)||1;
  var xy=pts.map(function(v,i){return [4+i*(w-8)/(pts.length-1),h-5-((v-mn)/rg)*(h-10)]});
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" aria-hidden="true"><polyline fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="'+xy.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ')+'"/><circle cx="'+xy[xy.length-1][0].toFixed(1)+'" cy="'+xy[xy.length-1][1].toFixed(1)+'" r="3" fill="currentColor"/></svg>';
}

function wkOf(d){return S.workouts[d]}
function ensureW(d){if(!S.workouts[d])S.workouts[d]={title:'',exercises:[]};return S.workouts[d]}
function findEx(id){var w=wkOf(ui.wdate);return w?w.exercises.find(function(e){return e.id===id}):null}
function prevTop(key,date){var h=history(key).filter(function(x){return x.d<date});return h.length?h[h.length-1]:null}
function prevLine(e){
  var p=prevTop(exKey(e),ui.wdate);if(!p)return 'Primeira vez que registas este exercício.';
  var t=topSet(e.sets),dl='';

  return 'Última vez ('+esc(fmtShort(p.d))+'): '+r1(p.kg)+' kg × '+p.reps+dl;
}

function scanSt(t){var e=$('#scanst');if(e)e.textContent=t}
function hints(){var m=new Map();m.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E,ZXing.BarcodeFormat.CODE_128]);m.set(ZXing.DecodeHintType.TRY_HARDER,true);return m}
function liveScan(){
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)||!window.ZXing){scanSt('A câmara ao vivo não está disponível aqui. Usa “Tirar foto ao código” ou escreve o código.');return}
  var v=$('#scanvideo');v.hidden=false;scanSt('A abrir a câmara…');
  var rd=new ZXing.BrowserMultiFormatReader(hints());
  stopLive=function(){try{rd.reset()}catch(e){}stopLive=function(){}};
  rd.decodeFromVideoDevice(null,v,function(res){if(res){var c=res.getText();stopLive();v.hidden=true;lookupCode(c)}}).then(function(){scanSt('A ler… mantém o código dentro do ecrã.')},function(){stopLive();v.hidden=true;scanSt('Não consegui abrir a câmara (permissão recusada ou indisponível). Usa “Tirar foto ao código” ou escreve o código.')});
}
function decodeFile(file){
  var url=URL.createObjectURL(file);
  var done=function(r){URL.revokeObjectURL(url);return r};
  var viaZX=function(){if(!window.ZXing)return Promise.resolve(null);return new ZXing.BrowserMultiFormatReader(hints()).decodeFromImageUrl(url).then(function(r){return r.getText()},function(){return null})};
  if('BarcodeDetector' in window&&window.createImageBitmap){
    return createImageBitmap(file).then(function(img){return new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']}).detect(img)}).then(function(r){return r&&r[0]?r[0].rawValue:viaZX()},viaZX).then(done,function(){return done(null)});
  }
  return viaZX().then(done,function(){return done(null)});
}
function lookupCode(code){
  scanSt('A procurar '+code+'…');
  getJSON(OFF+'/api/v2/product/'+encodeURIComponent(code)+'.json?fields=code,product_name,product_name_pt,brands,nutriments',12000).then(function(j){
    if(j&&j.status===1&&j.product){var f=mapOFF(j.product);if(f){ui.sheet.mode='search';ui.sheet.pending=f;drawFood();return}
      scanSt('Produto encontrado, mas sem valores nutricionais. Preenche manualmente.');ui.sheet.manualPre={name:(j.product.product_name||'')};return}
    scanSt('Código '+code+' não encontrado na Open Food Facts. Podes preencher manualmente.');
  },function(){scanSt('Código lido: '+code+'. Sem acesso à base de dados online neste modo, por isso preenche os valores manualmente.')});
}

    case 'pickFood':pickFood(+d.i);break;
    case 'confirmFood':{var s=ui.sheet,g=+$('#fg').value;if(!(g>0)){toast('Indica a quantidade em gramas');break}addFood($('#fmeal').value,s.sel,g);break}
    case 'manualAdd':{var nm=$('#mn-name').value.trim(),k=+$('#mn-k').value,g2=+$('#mn-g').value;if(!nm||!(k>=0)||$('#mn-k').value===''||!(g2>0)){toast('Preenche o nome, as calorias e a quantidade');break}addFood(ui.sheet.meal,{name:nm,brand:'',k:k,p:+$('#mn-p').value||0,c:+$('#mn-c').value||0,f:+$('#mn-f').value||0},g2);break}
    case 'editFood':editFoodSheet(d.m,d.i);break;
    case 'saveEditFood':{var g3=+$('#eg').value;if(!(g3>0)){toast('Indica a quantidade em gramas');break}var it=(S.food[ui.fdate][ui.sheet.meal]||[]).find(function(e){return e.id===ui.sheet.id});if(it)it.g=g3;save();closeSheet();render();break}
    case 'delFood':checkpoint();S.food[ui.fdate][d.m]=S.food[ui.fdate][d.m].filter(function(e){return e.id!==d.i});save();render();toast('Alimento removido',true);break;
    case 'liveScan':liveScan();break;
    case 'codeGo':{var c=($('#codeIn').value||'').replace(/\D/g,'');if(c.length<8){scanSt('Escreve o código completo (8 a 13 dígitos).');break}lookupCode(c);break}
    case 'addEx':openEx();break;
    case 'pickEx':pickEx(d.i);break;
    case 'confirmEx':{var e=ui.sheet.sel;if(!e||!e.name){toast('Escreve o nome do exercício');break}var w=ensureW(ui.wdate);w.exercises.push({id:uid(),name:e.name,en:e.en||e.name,group:e.group||'',dbId:e.dbId||null,sets:[{id:uid(),kg:'',reps:''}]});save();closeSheet();render();break}
    case 'exInfo':openExInfo(d.ex);break;
    case 'delEx':{checkpoint();var w2=wkOf(ui.wdate);w2.exercises=w2.exercises.filter(function(x){return x.id!==d.ex});if(!w2.exercises.length&&!w2.title)delete S.workouts[ui.wdate];save();render();toast('Exercício removido',true);break}
    case 'addSet':{var ex=findEx(d.ex),l=ex.sets[ex.sets.length-1];ex.sets.push({id:uid(),kg:l?l.kg:'',reps:l?l.reps:''});save();render();break}
    case 'delSet':{checkpoint();var ex2=findEx(d.ex);ex2.sets=ex2.sets.filter(function(x){return x.id!==d.set});save();render();toast('Série apagada',true);break}
    case 'showHist':openHist(d.k,d.n);break;
    case 'delWorkout':checkpoint();delete S.workouts[ui.wdate];save();render();toast('Treino apagado',true);break;
    case 'saveProfile':{var pr={nome:$('#pf-nome').value.trim(),sexo:$('#pf-sexo').value,idade:$('#pf-idade').value,altura:$('#pf-altura').value,peso:$('#pf-peso').value,atividade:$('#pf-ativ').value,objetivo:$('#pf-obj').value,kcal:$('#pf-kcal').value};
      if(!(+pr.idade>0&&+pr.altura>0&&+pr.peso>0)){toast('Preenche idade, altura e peso');break}
      S.profile=pr;if(!S.weights.length||S.weights[S.weights.length-1].kg!==+pr.peso)S.weights.push({d:todayK(),kg:+pr.peso});save();render();toast('Perfil guardado');break}
    case 'logWeight':{var kg=+$('#wt-in').value;if(!(kg>20&&kg<400)){toast('Indica um peso válido em kg');break}var t0=todayK();S.weights=S.weights.filter(function(x){return x.d!==t0});S.weights.push({d:t0,kg:kg});if(S.profile)S.profile.peso=String(kg);save();render();toast('Peso registado');break}
    case 'exportSave':exportSave();break;
    case 'exportCopy':exportCopy();break;
    case 'importGo':{try{var o=JSON.parse($('#imp').value);if(!o||typeof o!=='object'||!o.food||!o.workouts)throw 0;checkpoint();Object.keys(S).forEach(function(k){delete S[k]});Object.assign(S,{profile:null,food:{},recents:[],workouts:{},weights:[]},o);save();render();toast('Dados restaurados',true)}catch(e){toast('Esses dados não são válidos')}break}
    case 'wipe':ui.wipe=true;render();break;
    case 'wipeNo':ui.wipe=false;render();break;
    case 'wipeYes':checkpoint();Object.keys(S).forEach(function(k){delete S[k]});Object.assign(S,{profile:null,food:{},recents:[],workouts:{},weights:[]});ui.wipe=false;save();render();toast('Dados apagados',true);break;
  }
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.dataset&&(t.dataset.f==='kg'||t.dataset.f==='reps')){
    var ex=findEx(t.dataset.ex);if(!ex)return;var s=ex.sets.find(function(x){return x.id===t.dataset.set});if(!s)return;s[t.dataset.f]=t.value;save();
    var top=topSet(ex.sets);var sm=$('#sum-'+ex.id);if(sm)sm.innerHTML=sumLine(ex);var pv=$('#prev-'+ex.id);if(pv)pv.innerHTML=prevLine(ex);
    document.querySelectorAll('[data-exrow="'+ex.id+'"] .setrow[data-set]').forEach(function(r){r.classList.toggle('top',!!top&&r.dataset.set===top.id)});
  }else if(t.id==='wtitle'){var w=ensureW(ui.wdate);w.title=t.value;if(!w.title&&!w.exercises.length)delete S.workouts[ui.wdate];save()}
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='scanfile'&&t.files&&t.files[0]){scanSt('A ler a foto…');decodeFile(t.files[0]).then(function(c){t.value='';if(c)lookupCode(c);else scanSt('Não consegui ler o código. Tira outra foto, mais perto e bem iluminada, ou escreve o código.')})}
});
document.addEventListener('error',function(ev){var t=ev.target;if(t&&t.tagName==='IMG'&&t.closest&&t.closest('.anim')){var a=t.closest('.anim');if(a)a.style.display='none'}},true);
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&!$('#sheet').hidden)closeSheet()});

/* Ícone para o ecrã principal do iPhone */
try{var cv=document.createElement('canvas');cv.width=cv.height=180;var cx=cv.getContext('2d');cx.fillStyle='#0D7A64';cx.fillRect(0,0,180,180);cx.fillStyle='#fff';cx.fillRect(34,80,112,20);cx.fillRect(34,56,16,68);cx.fillRect(130,56,16,68);cx.fillRect(18,70,16,40);cx.fillRect(146,70,16,40);
  var lk=document.createElement('link');lk.rel='apple-touch-icon';lk.href=cv.toDataURL('image/png');document.head.appendChild(lk)}catch(e){}

render();
})();
</script>

</body></html>
